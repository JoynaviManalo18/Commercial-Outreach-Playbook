<title>Commercial Outreach Playbook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky header with breadcrumb trail; a fill-in strip for the current call; one step of the call flow (or one template) at a time, with branch buttons to the next step. */
:root{
  --bg:#f3f6f6; --surface:#ffffff; --sunk:#e9eff0; --ink:#13262f; --muted:#587078; --line:#d6e0e2;
  --accent:#0b7c84; --accent-ink:#ffffff; --accent-soft:#dff0ef; --info:#2f5fa8; --info-soft:#e1eaf8; --warn:#9a6200; --warn-soft:#fbefd5;
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1a1e; --surface:#162429; --sunk:#1c2d33; --ink:#e3ecee; --muted:#93a9b0; --line:#2a3f46;
  --accent:#3fb6b9; --accent-ink:#06191c; --accent-soft:#163b3e; --info:#85aef0; --info-soft:#1b2c48; --warn:#e9b04f; --warn-soft:#3a2d12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1a1e; --surface:#162429; --sunk:#1c2d33; --ink:#e3ecee; --muted:#93a9b0; --line:#2a3f46;
  --accent:#3fb6b9; --accent-ink:#06191c; --accent-soft:#163b3e; --info:#85aef0; --info-soft:#1b2c48; --warn:#e9b04f; --warn-soft:#3a2d12; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:980px;margin:0 auto}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
a{color:var(--accent)}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{padding-block:12px}
.title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.title h1{font-size:20px}
.title span{color:var(--muted);font-size:13px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px 4px;margin-top:6px;font-size:13.5px;list-style:none;padding:0}
.crumbs li{display:flex;align-items:center;gap:4px}
.crumbs li+li::before{content:"›";color:var(--muted);margin:0 2px}
.crumbs a{text-decoration:none;font-weight:600;padding:2px 4px;border-radius:5px}
.crumbs a:hover{background:var(--accent-soft)}
.crumbs [aria-current]{font-weight:700;color:var(--ink);padding:2px 4px}

.fill{background:var(--sunk);border-bottom:1px solid var(--line)}
.fill .wrap{padding-block:10px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-end}
.fill label{display:flex;flex-direction:column;gap:2px;font-size:11.5px;font-weight:700;color:var(--muted);flex:1 1 140px;min-width:0;text-transform:uppercase;letter-spacing:.04em}
.fill input{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 8px;font-size:14px;font-weight:400;text-transform:none;letter-spacing:0;width:100%}
.fill .who{flex:0 0 auto}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
.seg button{border:0;background:transparent;padding:4px 12px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.fill .note{flex:1 1 100%;font-size:12px;color:var(--muted);margin:0}
.fill .clear{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:0;font-size:12px}

main{padding-block:22px 70px}
.stephead{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}
.badge{flex:none;font-family:var(--f-mono);font-weight:500;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:4px 9px;font-size:13px;margin-top:3px}
.stephead h2{font-size:26px;line-height:1.15}
.stephead p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.say{border-left:3px solid var(--accent);background:var(--accent-soft);padding:12px 14px;border-radius:0 10px 10px 0;margin:10px 0;max-width:72ch}
.say::before{content:"Say";display:block;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.ask{border-left:3px solid var(--info);background:var(--info-soft);padding:12px 14px;border-radius:0 10px 10px 0;margin:10px 0;max-width:72ch}
.ask::before{content:"Ask & write down";display:block;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--info);margin-bottom:3px}
.ask ul{margin:0;padding-left:18px}
.tip{border-left:3px solid var(--warn);background:var(--warn-soft);padding:10px 14px;border-radius:0 10px 10px 0;margin:10px 0;max-width:72ch;font-size:14px}
.tip::before{content:"Tip";display:block;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--warn);margin-bottom:2px}
.do{color:var(--muted);font-size:14px;max-width:72ch;margin:10px 0}
.do b{color:var(--ink)}
h3.sub{font-size:16px;margin:22px 0 4px}
.ph{background:var(--sunk);border:1px dashed var(--line);border-radius:5px;padding:0 4px;font-family:var(--f-mono);font-size:.86em;white-space:nowrap}
.fv{background:color-mix(in srgb,var(--accent) 14%,transparent);border-radius:4px;padding:0 3px;font-weight:600}

.next{margin-top:26px;border-top:1px solid var(--line);padding-top:16px}
.next h3{font-size:12px;font-family:var(--f-body);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.choice{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.choice:hover{border-color:var(--accent)}
.choice b{font-weight:700}
.choice span{color:var(--muted);font-size:13px}
.choice b::after{content:" →";color:var(--accent)}

.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.card h3{font-size:17px;margin-bottom:6px}
.card ol,.card ul{margin:0;padding-left:20px}
.card li{margin:3px 0}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:16px 0 4px;font-size:13.5px}
.flow a{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 11px;text-decoration:none;font-weight:600}
.flow a:hover{border-color:var(--accent)}
.flow i{color:var(--muted);font-style:normal}

table.obj{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.obj td{border-bottom:1px solid var(--line);padding:11px 12px;vertical-align:top}
.obj td:first-child{font-weight:700;width:32%}
.obj .then{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.tbl{overflow-x:auto}
.cad{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:760px){.cad{grid-template-columns:minmax(0,1fr)}}
.cad div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.cad b{display:block;font-family:var(--f-mono);font-size:12.5px;color:var(--accent);margin-bottom:2px}

.svc{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.svc .card{padding:12px 14px}
.svc h3{font-size:15.5px;margin-bottom:2px}
.steps{margin:6px 0 12px;padding-left:22px;max-width:72ch}.steps li{margin:4px 0}
.facts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:12px 0}
@media (max-width:700px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.facts div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.facts b{display:block;font-family:var(--f-display);font-size:18px;color:var(--accent);line-height:1.2}
.facts span{font-size:12.5px;color:var(--muted)}
.cmp{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);min-width:560px}
.cmp th,.cmp td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.cmp th{background:var(--sunk);font-size:13px}
.cmp td:first-child{font-weight:700;width:18%}
.cmp td:nth-child(2){background:var(--accent-soft)}
.jump{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.jump a{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 11px;text-decoration:none;font-weight:600;font-size:13.5px}
.jump a:hover{border-color:var(--accent)}
h3.sub{scroll-margin-top:200px}
.tpl-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.tpl-meta{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 10px}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--sunk);color:var(--muted)}
.msg{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;white-space:pre-wrap;max-width:72ch}
.msg .subj{display:block;font-weight:700;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.pager a{text-decoration:none;font-weight:600;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;z-index:60}
</style>

<header>
  <div class="wrap">
    <div class="title"><h1>Commercial Outreach Playbook</h1><span>Oxi Fresh Carpet Cleaning of Northeast Florida · call scripts &amp; templates for Joy and Mary</span></div>
    <nav aria-label="Breadcrumb"><ol class="crumbs" id="crumbs"></ol></nav>
  </div>
</header>
<div class="fill">
  <div class="wrap">
    <div class="who"><label>I'm calling as<span class="seg" id="youSeg" role="group" aria-label="Your name"><button type="button" data-you="Joy" aria-pressed="false">Joy</button><button type="button" data-you="Mary" aria-pressed="false">Mary</button></span></label></div>
    <label>Company<input id="f-company" placeholder="Courtyard Marriott"></label>
    <label>Contact on file<input id="f-contact" placeholder="Falicia Fink"></label>
    <label>New GM<input id="f-gm" placeholder="if the contact left"></label>
    <label>Last cleaned<input id="f-last" placeholder="November 2024"></label>
    <label>Sean's visit<input id="f-meet" placeholder="Tue, Nov 12 at 10 am"></label>
    <p class="note">Optional: type the details for the call you're on and every script and template below fills in. <button type="button" class="clear" id="clearBtn">Clear for next call</button></p>
  </div>
</div>

<main class="wrap" id="main"></main>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
"use strict";
const PHONE="904-368-5776";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const F={you:"",company:"",contact:"",gm:"",last:"",meet:""};
const LABEL={you:"Your Name",company:"Company",contact:"Contact Name",gm:"GM Name",last:"Month Year",meet:"Appointment Date & Time"};
try{const s=JSON.parse(localStorage.getItem("cop-fill")||"{}");Object.keys(F).forEach(k=>{if(typeof s[k]==="string")F[k]=s[k]})}catch(e){}
const firstName=n=>(n||"").trim().split(/\s+/)[0]||"";
function val(k){if(k==="who")return firstName(F.gm)||firstName(F.contact);if(k==="cfirst")return firstName(F.contact);if(k==="gfirst")return firstName(F.gm);if(k==="phone")return PHONE;return F[k]}
function lab(k){return k==="who"?"Name":k==="cfirst"?"Contact Name":k==="gfirst"?"GM Name":LABEL[k]}
// {key} in text → filled value or placeholder chip
function fillHTML(t){return esc(t).replace(/\{(\w+)\}/g,(m,k)=>{const v=val(k);return v?`<span class="fv">${esc(v)}</span>`:`<span class="ph">[${esc(lab(k))}]</span>`})}
function fillText(t){return t.replace(/\{(\w+)\}/g,(m,k)=>val(k)||`[${lab(k)}]`)}

/* ---------- content ---------- */
const S=(t)=>`<div class="say">${fillHTML(t)}</div>`;
const A=(items)=>`<div class="ask"><ul>${items.map(i=>`<li>${fillHTML(i)}</li>`).join("")}</ul></div>`;
const TIP=(t)=>`<div class="tip">${t}</div>`;
const DO=(t)=>`<p class="do">${t}</p>`;
const go=(id,title,why)=>`<a class="choice" href="#${id}"><b>${esc(title)}</b><span>${esc(why)}</span></a>`;

const STEPS={
 prep:{badge:"0",title:"Before you call",crumb:["flow"],lead:"Two minutes of prep makes the call feel natural and personal.",
  body:()=>`<div class="card"><ul>
    <li>Look up the customer in the tracker or Launch Pad: <b>when we last cleaned</b>, <b>who we worked with</b>, and <b>what we cleaned</b>.</li>
    <li>Type those details in the bar above so the script uses the real names.</li>
    <li>Check nobody else is already working the account, so you and Mary don't call the same customer.</li>
    <li>Best times to reach businesses: <b>Tuesday–Thursday, 9:30–11:30 am or 2–4 pm</b> Florida time. Avoid Monday mornings and lunch.</li>
    <li>Have a pen ready for the new GM's name, phone and email.</li></ul></div>
    ${TIP("Smile when you dial. People can hear it, and a warm voice gets you past the front desk.")}`,
  next:[["opening","Start the call","Go to the opening"]]},
 opening:{badge:"1",title:"Opening",crumb:["flow"],lead:"Ask for the person we worked with before.",
  body:()=>`${S("Hi, good morning! This is {you} calling from Oxi Fresh Carpet Cleaning of Northeast Florida. May I please speak with {contact}?")}
    ${DO('If they ask what it\'s about:')}
    ${S("We've cleaned the carpets for {company} before, and I'm just checking in with {cfirst}.")}`,
  next:[["contact-there","They put me through","The contact still works there"],["contact-left","The contact has left","They no longer work there"],["voicemail","No answer / voicemail","Nobody picked up"],["objections","They push back","Common answers and what to say"]]},
 "contact-there":{badge:"2A",title:"The contact is still there",crumb:["flow","opening"],lead:"Reconnect warmly, then offer a simple next step.",
  body:()=>`${S("Hi {cfirst}, this is {you} with Oxi Fresh Carpet Cleaning. We took care of your carpets back in {last}, and I'm just calling to check in. How have things held up since then?")}
    ${S("We're reaching out to our commercial customers this season to help get their spaces fresh before the holidays. Aside from carpet, we also clean area rugs, upholstery, tile and grout, laminate floors and LVP floors.")}
    ${S("Would it help if we put together an estimate? Our franchise owner, Sean Rotolo, can meet you at the property to see your space and give you an exact quote. I'd be happy to check his availability for you.")}
    ${A(["Which areas need cleaning: carpet, area rugs, upholstery, tile & grout, laminate, LVP?","Roughly how big, or how many rooms or offices?","Best days and times. Can we come before opening, after hours or on a weekend?","Best email to send the quote to"])}
    ${S("A lot of our commercial clients like a regular schedule, quarterly or twice a year, so it's one less thing to remember. Would that be helpful for you too?")}
    ${DO('If they want an estimate or to meet, go to <a href="#estimate">Book an estimate with Sean</a>. Otherwise send the <a href="#tpl-checkin">check-in email</a>.')}`,
  next:[["estimate","They want an estimate or a meeting","Book a visit with Sean"],["why","They ask how we clean","Our method, vs. steam, our solutions"],["wrap-up","Wrap up the call","Confirm the next step and log it"],["objections","They push back","Common answers and what to say"]]},
 "contact-left":{badge:"2B",title:"The contact no longer works there",crumb:["flow","opening"],lead:"The most important part of this project. Stay friendly and find out who decides on vendors now.",
  body:()=>`${S("Oh, thank you for letting me know! I hope they're doing well. Could you help me with who handles vendors or facility needs now? Would that be your general manager?")}
    ${A(["The GM's or decision-maker's full name","Their title","Their direct phone number or extension","Their email address"])}
    ${S("Thank you so much! Is {gm} available by chance for a quick minute?")}
    <h3 class="sub">If the GM is available</h3>${DO('Go to <a href="#gm">3 · Talking with the GM</a>.')}
    <h3 class="sub">If the GM is not available</h3>
    ${S("No problem at all. Our team has cleaned for {company} in the past, and we'd love to set up a short meeting with {gfirst} to see if you need a carpet cleaning vendor. Would it be okay if I email them to find a good time? And could you let them know {you} from Oxi Fresh called?")}
    ${DO('Send the <a href="#tpl-gm">intro email to the new GM</a> the same day.')}
    <h3 class="sub">If they won't share the GM's details</h3>
    ${S("I completely understand. Is there a general email for vendor inquiries? Or may I leave my name and number for them? It's {you}, Oxi Fresh Carpet Cleaning, {phone}.")}
    ${TIP("Write the new person's details down right away and save them on the account, so the next call starts with the right person.")}`,
  next:[["gm","The GM is on the line","Introduce us and ask for a meeting"],["voicemail","Leave the GM a voicemail","GM not available"],["wrap-up","Wrap up the call","Confirm the next step and log it"]]},
 gm:{badge:"3",title:"Talking with the GM",crumb:["flow","opening","contact-left"],lead:"Introduce Oxi Fresh, mention our history with the location, and ask for a meeting so we can be on their vendor list.",
  body:()=>`${S("Hi {gfirst}, this is {you} from Oxi Fresh Carpet Cleaning of Northeast Florida. Our team has cleaned for {company} before, most recently in {last}. Since you're now overseeing the location, I wanted to introduce ourselves.")}
    ${S("Do you currently have a carpet cleaning vendor you're happy with?")}
    ${S("Aside from carpet, we also clean area rugs, upholstery, tile and grout, laminate floors and LVP floors.")}
    ${S("We'd love to be part of your vendor list. Our franchise owner, Sean Rotolo, would be happy to meet you at the property to see your space and give you a free estimate. Are mornings or afternoons usually better for you? I'll check his availability and get back to you with a couple of times.")}
    ${DO('If they say yes, go to <a href="#estimate">Book an estimate with Sean</a> to collect everything Sean needs.')}
    ${S("Is there a vendor setup process, like a W-9 or certificate of insurance? We're happy to send those over.")}
    ${DO('If they asked for paperwork, send the <a href="#tpl-vendor">vendor paperwork email</a>.')}`,
  next:[["estimate","They want to meet","Book a visit with Sean"],["wrap-up","Wrap up the call","Confirm the next step and log it"],["objections","They push back","Common answers and what to say"]]},
 estimate:{badge:"EST",title:"Book an estimate with Sean",crumb:["flow"],lead:"When a customer wants a price or a meeting, offer a free on-site visit with our franchise owner, Sean Rotolo. Take their details, check Sean's availability, then get back to them with times.",
  body:()=>`${S("We'd be happy to put together an estimate for you. Our franchise owner, Sean Rotolo, likes to meet our customers personally and see the property, so he can check the space and give you an exact quote. Let me check his availability, and I'll get back to you with a couple of times to meet you at your property. Would that be okay?")}
    ${A(["Site address, including the building or suite number","Days and times that usually work best for them (mornings, afternoons, specific days)","Who will meet Sean: their name, title and cell number","What to look at: carpet, area rugs, upholstery, tile & grout, laminate, LVP","Roughly how big, or how many rooms or offices","Parking, gate codes or check-in instructions","Best phone or email to get back to them"])}
    ${S("While Sean is there, is there anything else you'd like him to look at? Aside from carpet, we also clean area rugs, upholstery, tile and grout, laminate floors and LVP floors.")}
    ${S("Thank you so much! I'll check with Sean and get back to you by [tomorrow / day] with a couple of times to meet you at {company}.")}
    <div class="card" style="margin-top:14px"><h3>After the call</h3><ol>
      <li>Send Sean the details: company, address, contact name and cell, what to look at, their preferred days and times, and access notes.</li>
      <li>Once Sean gives you two or three times, get back to the customer <b>the same or next business day</b> by phone or with the <a href="#tpl-availability">Sean's availability email</a>.</li>
      <li>When they pick a time, put it on <b>Sean's calendar</b> and send the <a href="#tpl-confirm">estimate appointment confirmation</a>.</li>
      <li>Update the tracker: status <b>Meeting set</b>, with the appointment date. Until then, set the next follow-up to the day you promised to get back to them.</li>
      <li>The day before the visit, send the <a href="#tpl-reminder">reminder text</a>.</li></ol></div>
    ${TIP("Always get back to them when you said you would, even if Sean is still checking his schedule. A quick “Sean is reviewing his calendar, I'll have times for you tomorrow” keeps their trust.")}`,
  next:[["tpl-availability","Send Sean's availability","Offer the times Sean gave you"],["tpl-confirm","Confirm the appointment","Once they pick a time"],["wrap-up","Wrap up the call","Confirm the next step and log it"]]},
 why:{badge:"O₂",title:"Why Oxi Fresh",crumb:[],lead:"How our low-moisture cleaning works, why it matters to businesses, how it's different from steam cleaning, and what to say when someone asks about our solutions.",
  body:()=>`<nav class="jump" aria-label="On this page"><a href="#why" data-jump="w-method">Our method</a><a href="#why" data-jump="w-business">Why it matters for businesses</a><a href="#why" data-jump="w-compare">Oxi Fresh vs. steam cleaning</a><a href="#why" data-jump="w-chem">“What do you use?”</a></nav>
    <h3 class="sub" id="w-method">Our low-moisture method (encapsulation)</h3>
    <ol class="steps">

const greetGM=t=>F.gm?t:t.replace(/\{gfirst\}/g,"{cfirst}");

/* ---------- routing & breadcrumbs ---------- */
const NAMES={home:"Playbook",flow:"Call flow",templates:"Templates",rhythm:"Follow-up rhythm",services:"Everything we clean",why:"Why Oxi Fresh"};
Object.keys(STEPS).forEach(k=>{if(!NAMES[k])NAMES[k]=(STEPS[k].badge&&/^[0-9]/.test(STEPS[k].badge)?STEPS[k].badge+" · ":"")+STEPS[k].title});
Object.keys(TPL).forEach(k=>NAMES["tpl-"+k]=TPL[k].name);
const FLOW=["prep","opening","contact-there","contact-left","gm","estimate","voicemail","objections","wrap-up"];
function trail(r){
  if(r==="home") return ["home"];
  if(r==="flow") return ["home","flow"];
  if(r==="templates") return ["home","templates"];
  if(r.startsWith("tpl-")) return ["home","templates",r];
  const s=STEPS[r]; if(!s) return ["home"];
  return ["home",...s.crumb,r];
}
function renderCrumbs(r){
  const t=trail(r);
  $("#crumbs").innerHTML=t.map((k,i)=>i===t.length-1?`<li><span aria-current="page">${esc(NAMES[k])}</span></li>`:`<li><a href="#${k==="flow"?"prep":k}">${esc(NAMES[k])}</a></li>`).join("");
}
function render(){
  let r=(location.hash||"").slice(1)||"home";
  if(r==="flow") r="opening";
  if(!(r==="home"||r==="templates"||STEPS[r]||(r.startsWith("tpl-")&&TPL[r.slice(4)]))) r="home";
  renderCrumbs(r);
  const m=$("#main");
  if(r==="home") m.innerHTML=homeHTML();
  else if(r==="templates") m.innerHTML=templatesHTML();
  else if(r.startsWith("tpl-")) m.innerHTML=tplHTML(r.slice(4));
  else m.innerHTML=stepHTML(r);
  m.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>copy(b.dataset.copy,b));
  m.querySelectorAll("[data-jump]").forEach(a=>a.onclick=e=>{e.preventDefault();const t=document.getElementById(a.dataset.jump);if(t)t.scrollIntoView({behavior:"smooth",block:"start"})});
  current=r;
}
let current="home";
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0)});

  <div class="flow">${["prep","opening"].map(k=>`<a href="#${k}">${esc(NAMES[k])}</a>`).join("<i>›</i>")}<i>›</i><a href="#contact-there">2A Contact is there</a><i>or</i><a href="#contact-left">2B Contact has left</a><i>›</i><a href="#gm">3 GM</a><i>›</i><a href="#estimate">Estimate with Sean</a><i>›</i><a href="#wrap-up">4 Wrap-up</a></div>

    <div class="card"><h3>Call flow</h3><ol>${FLOW.map(k=>`<li><a href="#${k}">${esc(STEPS[k].title)}</a></li>`).join("")}</ol><div class="btns"><a class="btn primary" href="#prep" style="text-decoration:none">Start here</a></div></div>
    <div class="card"><h3>Email &amp; text templates</h3><ul>${Object.keys(TPL).map(k=>`<li><a href="#tpl-${k}">${esc(TPL[k].name)}</a></li>`).join("")}</ul></div>
    <div class="card"><h3>Why Oxi Fresh</h3><p style="margin:0 0 8px" class="muted">Our low-moisture method, why it matters for businesses, how it compares with steam cleaning, and what to say about our solutions.</p><a href="#why">Read it before your first call</a></div>
    <div class="card"><h3>Everything we clean</h3><p style="margin:0 0 8px" class="muted">Carpet, area rugs, upholstery, tile &amp; grout, laminate and LVP floors. Mention them on every call.</p><a href="#services">See the services list</a></div>
    <div class="card"><h3>Estimates with Sean</h3><p style="margin:0 0 8px" class="muted">When a customer wants a price or a meeting, book a free on-site estimate with our franchise owner, Sean Rotolo.</p><a href="#estimate">How to book it</a></div>
    <div class="card"><h3>Follow-up rhythm</h3><p style="margin:0 0 8px" class="muted">Day 1 call · Day 3 call or text · Day 7 call · Day 14 final email · +60 days try again.</p><a href="#rhythm">See the full rhythm</a></div>
  </div>
  ${TIP("Fill in the bar at the top (company, contact, GM, last cleaned) before a call and every script and template on this page uses those names. Click “Clear for next call” when you're done.")}`;

function stepHTML(k){
  const s=STEPS[k], i=FLOW.indexOf(k);
  const prev=i>0?FLOW[i-1]:null, nxt=i>=0&&i<FLOW.length-1?FLOW[i+1]:null;
  return `<div class="stephead"><span class="badge">${esc(s.badge)}</span><div><h2>${esc(s.title)}</h2><p>${esc(s.lead)}</p></div></div>
  ${s.body()}
  ${s.next&&s.next.length?`<div class="next"><h3>What happened? Go to</h3><div class="choices">${s.next.map(n=>go(n[0],n[1],n[2])).join("")}</div></div>`:""}
  ${i>=0?`<div class="pager"><span>${prev?`<a href="#${prev}">← ${esc(STEPS[prev].title)}</a>`:""}</span><span>${nxt?`<a href="#${nxt}">${esc(STEPS[nxt].title)} →</a>`:""}</span></div>`:""}`;
}
function templatesHTML(){
  return `<div class="stephead"><span class="badge">✉</span><div><h2>Email &amp; text templates</h2><p>Pick the message for what just happened. Each one fills in with the details from the bar at the top.</p></div></div>
  <div class="tpl-list">${Object.keys(TPL).map(k=>go("tpl-"+k,TPL[k].name,TPL[k].when)).join("")}</div>`;
}
function tplParts(k){const t=TPL[k];let subj=t.subject,body=t.body();if(k==="vendor"){subj=greetGM(subj);body=greetGM(body)}if(k==="vm"&&F.gm&&!F.contact){body=body.replace(/\{cfirst\}/g,"{gfirst}")}return {subj,body}}
function tplHTML(k){
  const t=TPL[k], p=tplParts(k), keys=Object.keys(TPL), i=keys.indexOf(k);
  return `<div class="stephead"><span class="badge">${t.kind==="Text"?"SMS":"✉"}</span><div><h2>${esc(t.name)}</h2><p>${esc(t.when)}</p></div></div>
  <div class="msg">${p.subj?`<span class="subj">Subject: ${fillHTML(p.subj)}</span>`:""}${fillHTML(p.body)}</div>
  <div class="btns">${p.subj?`<button type="button" class="btn" data-copy="subj">Copy subject</button>`:""}<button type="button" class="btn primary" data-copy="body">Copy ${t.kind==="Text"?"text":"message"}</button></div>
  ${/\[[A-Z]/.test(fillText(p.subj+p.body))?`<p class="do">Anything still in <span class="ph">[brackets]</span> needs to be filled in before sending.</p>`:""}
  <div class="pager"><span>${i>0?`<a href="#tpl-${keys[i-1]}">← ${esc(TPL[keys[i-1]].name)}</a>`:""}</span><span>${i<keys.length-1?`<a href="#tpl-${keys[i+1]}">${esc(TPL[keys[i+1]].name)} →</a>`:""}</span></div>`;
}

/* ---------- copy ---------- */
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2000)}
function copy(what,btn){
  const k=current.slice(4), p=tplParts(k), txt=fillText(what==="subj"?p.subj:p.body);
  const ok=()=>{const o=btn.textContent;btn.textContent="Copied";setTimeout(()=>btn.textContent=o,1400)};
  const fallback=()=>{const el=document.querySelector(".msg");if(!el)return;const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Text selected. Press Ctrl+C (⌘C on Mac) to copy.")};
  try{navigator.clipboard.writeText(txt).then(ok,fallback)}catch(e){fallback()}
}

/* ---------- fill-in bar ---------- */
function save(){try{localStorage.setItem("cop-fill",JSON.stringify(F))}catch(e){}}
["company","contact","gm","last","meet"].forEach(k=>{const el=$("#f-"+k);el.value=F[k];el.addEventListener("input",()=>{F[k]=el.value.trim();save();clearTimeout(render.t);render.t=setTimeout(render,150)})});
function syncYou(){document.querySelectorAll("#youSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.you===F.you))}
document.querySelectorAll("#youSeg button").forEach(b=>b.onclick=()=>{F.you=b.dataset.you;save();syncYou();render()});
$("#clearBtn").onclick=()=>{["company","contact","gm","last","meet"].forEach(k=>{F[k]="";$("#f-"+k).value=""});save();render();toast("Cleared")};
syncYou();
render();
})();
</script>
